# Foundry configuration
# Docs: https://book.getfoundry.sh/reference/config/

[profile.default]
src = "."                         # contract sources live at the root of this folder
test = "test"                     # Solidity tests live in ./test
out = "out"                       # forge build artifacts
libs = ["lib"]                    # dependencies (OpenZeppelin, forge-std, etc.)
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
# Only compile the files we care about (skip older project-level things if present)
# auto-detect tests/contracts by default

# Exclude .pen files and anything not Solidity
[fmt]
line_length = 120

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 64
depth = 32
fail_on_revert = false
